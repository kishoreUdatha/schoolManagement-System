services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sms_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-sms}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sms} -d ${POSTGRES_DB:-sms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sms-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sms-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sms}:${POSTGRES_PASSWORD:-sms_dev_password}@postgres:5432/${POSTGRES_DB:-sms}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sms-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env.local
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    # Production bundle (built with `next build`) served by `next start`.
    # Switch back to `npm run dev` for live-reload during active development.
    command: npm start

  # Optional workflow automation (see integrations/n8n/README.md).
  # Start with: docker compose --profile automation up -d n8n
  n8n:
    image: n8nio/n8n:latest
    container_name: sms-n8n
    profiles: ["automation"]
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      SMS_API_URL: http://backend:8000
      SMS_ADMIN_EMAIL: ${SMS_ADMIN_EMAIL:-}
      SMS_ADMIN_PASSWORD: ${SMS_ADMIN_PASSWORD:-}
      SMS_ADMISSIONS_YEAR_ID: ${SMS_ADMISSIONS_YEAR_ID:-}
      SMS_ADMISSIONS_SECTION_ID: ${SMS_ADMISSIONS_SECTION_ID:-}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./integrations/n8n:/workflows:ro
    depends_on:
      - backend

volumes:
  n8n-data:
  postgres-data:
  redis-data:
